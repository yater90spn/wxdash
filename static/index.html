<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=2560, height=720, initial-scale=1">
<title>Weather Board</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#0b0f14; --panel:#121820; --panel2:#171f29; --line:#243040;
  --ink:#e8eef5; --ink2:#9aabbd; --ink3:#5f7184;
  --s0:#e5534b; --s1:#e8913a; --s2:#d8c13f; --s3:#5fbf6a; --s4:#38b2ac;
  --temp:#f0a35e; --feels:#f0a35e; --rain:#4a9eea; --wind:#9aabbd; --hl:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2560px;height:720px;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Inter","Segoe UI","DejaVu Sans",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;cursor:none}
body.dim{filter:brightness(.55)}
.app{display:grid;grid-template-columns:400px 1fr;height:720px;gap:14px;padding:14px}

/* ── Now panel ───────────────────── */
.now{background:var(--panel);border-radius:18px;padding:26px 28px;display:flex;flex-direction:column}
.place{font-size:20px;color:var(--ink2);letter-spacing:.02em}
.clock{font-size:60px;font-weight:300;letter-spacing:-.02em;line-height:1;margin-top:6px}
.date{font-size:20px;color:var(--ink2);margin-top:6px}
.temp-row{display:flex;align-items:flex-end;gap:16px;margin-top:20px}
.big{font-size:104px;font-weight:200;line-height:.85;letter-spacing:-.04em}
.big sup{font-size:44px;vertical-align:top;position:relative;top:10px;font-weight:300}
.icon{width:84px;height:84px}
.sky{font-size:24px;margin-top:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin-top:16px;font-size:18px}
.kv dt{color:var(--ink3)} .kv dd{color:var(--ink)}
.meta{margin-top:12px;font-size:14px;color:var(--ink3);line-height:1.45}
.meta .warn{color:var(--s1)}
.quick{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.qbtns{display:flex;flex-wrap:wrap;gap:10px}
.qbtn{flex:1 1 0;min-width:72px;min-height:54px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:14px;font-family:inherit;font-weight:600;font-size:19px;line-height:1;cursor:pointer}
.qbtn:active{background:var(--line)}
.pwr{align-self:stretch;background:transparent;border:1px solid var(--line);color:var(--ink3);border-radius:999px;padding:9px 18px;font-family:inherit;font-weight:500;font-size:15px;line-height:1;cursor:pointer}

/* quick-check pop-up */
.modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:flex;align-items:center;justify-content:center;z-index:50}
.modal[hidden]{display:none}
.sheet{display:flex;gap:22px;background:var(--panel2);border:1px solid var(--line);border-radius:22px;padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:680px}
.sched{width:600px;display:flex;flex-direction:column}
.sched h2{font-size:30px;font-weight:600}
.sched .sub{color:var(--ink2);font-size:18px;margin-top:2px}
.sched .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;padding:0 15px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-weight:500;font-size:18px;line-height:1;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:60px;height:54px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-weight:600;font-size:26px;line-height:1;cursor:pointer}
.stepper button:disabled{opacity:.3}
.stepper .val{min-width:150px;text-align:center;font-size:24px;font-weight:600}
.sched .close{margin-top:auto;align-self:flex-start;min-height:50px;padding:0 26px;border-radius:12px;background:transparent;border:1px solid var(--line);color:var(--ink2);font-family:inherit;font-weight:500;font-size:18px;line-height:1;cursor:pointer}
.mcard{width:440px;flex:none;transition:opacity .15s}
.mcard .card{height:100%;flex:none;width:100%;cursor:default}
.mcard.loading{opacity:.45}
.card .warn-line{margin-top:10px;font-size:16px;color:var(--s1)}
.mcard .err{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:var(--ink2);font-size:20px;background:var(--panel);border-radius:18px}

/* ── Right side ──────────────────── */
.main{display:grid;grid-template-rows:minmax(0,1fr) 240px;gap:14px;min-width:0;min-height:0;height:692px}
.cards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain}
.cards.dragging{scroll-snap-type:none}
.cards.dragging .card{pointer-events:none}
/* fade the edge(s) where more cards are off-screen */
.cards.more-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 110px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 110px),transparent)}
.cards.more-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 110px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 110px),transparent)}
.cards.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 110px,#000 calc(100% - 110px),transparent);mask-image:linear-gradient(to right,transparent,#000 110px,#000 calc(100% - 110px),transparent)}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 404px;min-height:0;scroll-snap-align:start;background:var(--panel);border-radius:18px;
  padding:16px 20px 14px;display:flex;flex-direction:column;border:2px solid transparent;
  transition:border-color .15s, background .15s}
.card.sel{border-color:var(--hl);background:var(--panel2)}
.card.sugg{border:2px dashed #2f4a3a;background:#101a16}
.card.sugg.sel{border-color:var(--s3)}
.card .tag{color:var(--s3);font-weight:600}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .day{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);white-space:nowrap}
.card .live{color:var(--s4);font-weight:600}
.card .where{font-size:14px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h2{font-size:25px;font-weight:600;margin-top:2px;line-height:1.15}
.card .when{font-size:17px;color:var(--ink2);margin-top:2px}
.score-row{display:flex;align-items:center;gap:14px;margin-top:10px}
.ring{width:64px;height:64px;flex:none}
.score-txt .lbl{font-size:14px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.score-txt .verdict{font-size:23px;font-weight:500;line-height:1.15;margin-top:2px}
.lines{list-style:none;margin-top:10px;font-size:18px;line-height:1.38}
.lines li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lines li:first-child{font-size:20px;font-weight:500}
.advice{margin-top:auto;background:var(--bg);border-radius:12px;padding:9px 12px;font-size:16px;line-height:1.32;margin-top:10px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.advice b{color:var(--ink2);font-weight:600}
.hstrip{display:flex;gap:3px;margin-top:10px;height:8px}
.hstrip i{flex:1;border-radius:3px}
.conf{font-size:13px;color:var(--ink3);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--ink3);font-size:22px;padding:40px}

.timeline{background:var(--panel);border-radius:18px;padding:8px 14px 6px;position:relative;min-height:0;overflow:hidden}
.tl-scroll{position:absolute;left:58px;right:14px;top:8px;bottom:6px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
.tl-scroll::-webkit-scrollbar{display:none}
.tl-scroll svg{display:block;height:100%}
.tl-axis{position:absolute;left:14px;top:8px;width:44px;bottom:6px;overflow:visible}
.tl-head{position:absolute;left:70px;right:22px;top:6px;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--ink3);pointer-events:none;z-index:2}
.tl-head .place{color:var(--ink);font-weight:600;font-size:14px;background:var(--panel);padding:2px 8px;border-radius:6px}
.tl-head .place.away{color:var(--s4)}
.tl-head .day{color:var(--ink2);font-weight:600;background:var(--panel);padding:2px 8px;border-radius:6px}
.tl-head .spacer{flex:1}
.tl-now{pointer-events:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:999px;
  padding:6px 16px;font-family:inherit;font-weight:600;font-size:15px;line-height:1;cursor:pointer;visibility:hidden}
.tl-now.show{visibility:visible}
.tl-legend{display:flex;gap:16px;background:var(--panel);padding:2px 8px;border-radius:6px}
.tl-legend span::before{content:"";display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:middle;background:currentColor}
</style>
</head>
<body>
<div class="app">
  <section class="now" id="now"></section>
  <section class="main">
    <div class="cards" id="cards"></div>
    <div class="timeline">
      <svg class="tl-axis" id="tlAxis"></svg>
      <div class="tl-scroll" id="tlScroll"><svg id="tl"></svg></div>
      <div class="tl-head">
        <span class="place" id="tlPlace"></span>
        <span class="day" id="tlDay"></span>
        <span class="tl-legend">
          <span style="color:var(--temp)">Temp</span>
          <span style="color:var(--ink3)">Feels like</span>
          <span style="color:var(--rain)">Rain chance</span>
          <span style="color:var(--s4)" id="tideLeg">Tide</span>
        </span>
        <span class="spacer"></span>
        <button class="tl-now" id="tlNow" type="button">← Now</button>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet">
    <div class="sched">
      <h2 id="mTitle"></h2>
      <div class="sub" id="mSub"></div>
      <div class="lbl">Day</div>
      <div class="chips" id="mDays"></div>
      <div class="lbl">Start</div>
      <div class="stepper"><button type="button" id="mMinus" aria-label="Earlier">−</button>
        <span class="val" id="mStart"></span><button type="button" id="mPlus" aria-label="Later">+</button></div>
      <div class="lbl">How long</div>
      <div class="chips" id="mHours"></div>
      <button class="close" type="button" id="mClose">Close</button>
    </div>
    <div class="mcard" id="mCard"></div>
  </div>
</div>
<script>
const REFRESH_MS = 5 * 60 * 1000;
let DATA = null, SELECTED = null;

const scoreColor = s => s < 3 ? "var(--s0)" : s < 5 ? "var(--s1)" : s < 6.5 ? "var(--s2)" : s < 8.5 ? "var(--s3)" : "var(--s4)";
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => d == null ? "—" : COMPASS[Math.round(((d % 360) / 22.5)) % 16];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r0 = v => v == null ? "—" : Math.round(v);
const hourLbl = d => { const h = d.getHours(); return h === 0 ? "12a" : h === 12 ? "12p" : h < 12 ? h + "a" : (h - 12) + "p"; };

// Minimal weather glyphs (sun / moon / cloud / rain / snow / storm / fog)
function icon(code, day) {
  const sun = day ? `<circle cx="34" cy="34" r="13" fill="#f2c14e"/>${[0,45,90,135,180,225,270,315].map(a=>`<line x1="34" y1="12" x2="34" y2="5" stroke="#f2c14e" stroke-width="4" stroke-linecap="round" transform="rotate(${a} 34 34)"/>`).join("")}`
                  : `<path d="M40 14a20 20 0 1 0 16 30a16 16 0 1 1-16-30z" fill="#cfd8e3"/>`;
  const cloud = (fill="#b8c4d1") => `<path d="M28 70h40a14 14 0 0 0 0-28a20 20 0 0 0-38-4a13 13 0 0 0-2 32z" fill="${fill}"/>`;
  const drops = `<g stroke="#4a9eea" stroke-width="4" stroke-linecap="round"><line x1="36" y1="78" x2="32" y2="88"/><line x1="50" y1="78" x2="46" y2="88"/><line x1="64" y1="78" x2="60" y2="88"/></g>`;
  let g;
  if ([95,96,97,99].includes(code)) g = cloud("#8090a0") + `<path d="M50 70l-8 14h8l-5 12l14-18h-8l5-8z" fill="#f2c14e"/>`;
  else if ([71,73,75,77,85,86].includes(code)) g = cloud() + `<g fill="#fff"><circle cx="36" cy="82" r="3.5"/><circle cx="50" cy="86" r="3.5"/><circle cx="64" cy="82" r="3.5"/></g>`;
  else if (code >= 51) g = cloud("#8f9cab") + drops;
  else if (code >= 45) g = `<g stroke="#b8c4d1" stroke-width="5" stroke-linecap="round"><line x1="14" y1="40" x2="82" y2="40"/><line x1="20" y1="54" x2="76" y2="54"/><line x1="14" y1="68" x2="82" y2="68"/></g>`;
  else if (code === 3) g = cloud();
  else if (code === 2) g = sun + cloud();
  else if (code === 1) g = sun + `<path d="M48 72h28a10 10 0 0 0 0-20a14 14 0 0 0-27-2a9 9 0 0 0-1 22z" fill="#b8c4d1"/>`;
  else g = sun;
  return `<svg class="icon" viewBox="0 0 96 96">${g}</svg>`;
}

function ring(score) {
  const C = 2 * Math.PI * 32, f = Math.max(0, Math.min(10, score)) / 10;
  return `<svg class="ring" viewBox="0 0 76 76">
    <circle cx="38" cy="38" r="32" fill="none" stroke="var(--line)" stroke-width="7"/>
    <circle cx="38" cy="38" r="32" fill="none" stroke="${scoreColor(score)}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${C * f} ${C}" transform="rotate(-90 38 38)"/>
    <text x="38" y="45" text-anchor="middle" fill="var(--ink)" font-size="22" font-weight="600">${score.toFixed(1)}</text>
  </svg>`;
}

function renderNow(d) {
  const n = d.now, t = new Date();
  const errs = (d.errors || []).length ? `<div class="warn">⚠ ${esc(d.errors.join(" · "))}</div>` : "";
  document.getElementById("now").innerHTML = `
    <div class="place">${esc(d.place)}${d.demo ? " · demo data" : ""}</div>
    <div class="clock" id="clock">${t.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}</div>
    <div class="date">${t.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"})}</div>
    <div class="temp-row"><div class="big">${r0(n.temp)}<sup>°</sup></div>${icon(n.code, n.is_day)}</div>
    <div class="sky">${esc(n.sky)} · feels ${r0(n.feels)}°</div>
    <dl class="kv">
      <dt>High / Low</dt><dd>${r0(n.hi)}° / ${r0(n.lo)}°</dd>
      <dt>Wind</dt><dd>${esc(n.wind)}${n.gust && n.gust - parseFloat(n.wind.split(" ")[1]) >= 6 ? `, gusts ${r0(n.gust)}` : ""}</dd>
      <dt>Dew point</dt><dd>${r0(n.dew)}°</dd>
      <dt>Rain chance</dt><dd>${r0(n.pop)}%</dd>
      <dt>UV</dt><dd>${n.uv == null ? "—" : n.uv.toFixed(0)}</dd>
      <dt>Sun</dt><dd>↑ ${esc(n.sunrise)} · ↓ ${esc(n.sunset)}</dd>
    </dl>
    <div class="meta">${staleNote(d)} · Open-Meteo (HRRR / NBM / GFS)${errs}<div class="warn" id="offline"></div></div>
    <div class="quick">
      ${(d.quick || []).length ? `<div class="qbtns">${d.quick.map(q => `<button class="qbtn" type="button" data-kind="${esc(q.kind)}">${esc(q.label)}</button>`).join("")}</div>` : ""}
      <button class="pwr" id="pwrBtn" type="button">⏻ Screen off</button>
    </div>`;
  document.querySelectorAll(".qbtn").forEach(b => b.onclick = e => { e.stopPropagation(); openCheck(b.dataset.kind); });
}

function staleNote(d) {
  const age = d.data_age_min ?? 0, fetched = new Date(Date.now() - age * 60000);
  const t = fetched.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  return age > 2 * (d.refresh_minutes || 30)
    ? `<span class="warn">⚠ Forecast is ${age >= 120 ? Math.round(age / 60) + " h" : age + " min"} old (${t})</span>`
    : `Forecast from ${t}`;
}

function cardHTML(c, opts = {}) {
  return `
    <article class="card ${c.suggested ? "sugg" : ""} ${SELECTED === c.id && !opts.modal ? "sel" : ""}" data-id="${esc(c.id)}">
      <div class="top"><span class="day">${c.live ? '<span class="live">● Now</span>' : esc(c.day)}${c.suggested ? ' · <span class="tag">Suggested</span>' : ""}</span><span class="where">${esc(c.location)}</span></div>
      <h2>${esc(c.title)}</h2>
      <div class="when">${esc(c.when)}</div>
      <div class="score-row">${ring(c.score)}
        <div class="score-txt"><div class="lbl">${esc(c.score_label)}</div><div class="verdict">${esc(c.verdict)}</div></div>
      </div>
      <ul class="lines">${c.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      ${opts.modal && c.warning ? `<div class="warn-line">⚠ ${esc(c.warning)}</div>` : ""}
      <div class="advice"><b>${esc(c.advice_label)}:</b> ${esc(c.advice)}</div>
      <div class="hstrip">${c.hourly.map(h => `<i style="background:${scoreColor(h.s)}" title="${h.s}"></i>`).join("")}</div>
      <div class="conf">${esc(c.confidence)}</div>
    </article>`;
}

function renderCards(d) {
  const el = document.getElementById("cards");
  if (!d.cards.length) { el.innerHTML = `<div class="empty">Nothing planned in the next week. Add plans or turn on suggestions at ${esc(d.planner_url || location.host + '/plan')}</div>`; return; }
  el.innerHTML = d.cards.map(c => cardHTML(c)).join("");
  el.querySelectorAll(".card").forEach(card => card.addEventListener("click", () => {
    SELECTED = SELECTED === card.dataset.id ? null : card.dataset.id;
    el.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", c.dataset.id === SELECTED));
    renderTimeline(DATA);
    jumpTimeline();
  }));
  updateEdges();
}

// ---------- swipe / drag to scroll the cards ----------
// Native touch panning works when Chromium sees a real touchscreen. Some panels
// (or Wayland setups) deliver touch as mouse events instead, which never scroll,
// so we also scroll on mouse/pen drags ourselves and snap to the nearest card.
function updateEdges() {
  const el = document.getElementById("cards");
  const max = el.scrollWidth - el.clientWidth;
  el.classList.toggle("more-l", el.scrollLeft > 4);
  el.classList.toggle("more-r", el.scrollLeft < max - 4);
}
// Drag-to-scroll for mouse/pen input (see note above). snapStep: px to snap to, or null
// for free scrolling with a little glide.
function dragScroll(el, snapStep, onScroll) {
  let down = null, dragged = false, samples = [];
  el.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch") return;          // browser handles real touch panning
    down = {x: e.clientX, left: el.scrollLeft, id: e.pointerId};
    dragged = false; samples = [{x: e.clientX, t: e.timeStamp}];
  });
  el.addEventListener("pointermove", e => {
    if (!down || e.pointerId !== down.id) return;
    const dx = e.clientX - down.x;
    if (!dragged && Math.abs(dx) > 10) {
      dragged = true; el.classList.add("dragging");
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
    }
    if (dragged) {
      el.scrollLeft = down.left - dx;
      samples.push({x: e.clientX, t: e.timeStamp}); if (samples.length > 6) samples.shift();
    }
  });
  const end = e => {
    if (!down || e.pointerId !== down.id) return;
    if (dragged) {
      const a = samples[0], b = samples[samples.length - 1];
      const v = (b.x - a.x) / Math.max(1, b.t - a.t);   // px per ms; negative = flick left
      if (snapStep) {
        const step = snapStep();
        let idx = Math.round(el.scrollLeft / step);
        if (Math.abs(v) > 0.4) idx = v < 0 ? Math.ceil(el.scrollLeft / step) : Math.floor(el.scrollLeft / step);
        if (Math.abs(v) > 1.5) idx += v < 0 ? 1 : -1;      // hard flick: one more card
        el.scrollTo({left: idx * step, behavior: "smooth"});
      } else if (Math.abs(v) > 0.3) {
        el.scrollBy({left: -v * 350, behavior: "smooth"}); // glide after a flick
      }
      setTimeout(() => el.classList.remove("dragging"), 350);
    }
    down = null;
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  // A drag must not also count as a tap
  el.addEventListener("click", e => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
  if (onScroll) el.addEventListener("scroll", onScroll, {passive: true});
  // Mouse wheel / trackpad: vertical wheel scrolls sideways
  el.addEventListener("wheel", e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; e.preventDefault(); }
  }, {passive: false});
}
(function () {
  const cards = document.getElementById("cards");
  dragScroll(cards, () => { const c = cards.querySelector(".card"); return c ? c.offsetWidth + 14 : 418; }, updateEdges);
  dragScroll(document.getElementById("tlScroll"), null, tlScrolled);
  document.getElementById("tlNow").addEventListener("click", () => {
    if (SELECTED) { SELECTED = null; document.querySelectorAll(".card.sel").forEach(c => c.classList.remove("sel")); renderTimeline(DATA); }
    document.getElementById("tlScroll").scrollTo({left: nowX(), behavior: "smooth"});
  });
  window.addEventListener("resize", () => { updateEdges(); if (DATA) renderTimeline(DATA); });
  // Kiosk: after 3 idle minutes, clear the selection and return the strip to now
  let idle;
  const poke = () => { clearTimeout(idle); idle = setTimeout(() => {
    if (SELECTED) { SELECTED = null; document.querySelectorAll(".card.sel").forEach(c => c.classList.remove("sel")); renderTimeline(DATA); }
    document.getElementById("tlScroll").scrollTo({left: nowX(), behavior: "smooth"});
  }, 180000); };
  document.addEventListener("pointerdown", poke); poke();
})();

// ---------- quick check pop-up ----------
// "What would it be like to go now?" for watched activities. Defaults to now → +2 h;
// the day / start / length controls let you look ahead (e.g. tomorrow morning).
const Q = {kind: null, day: 0, hour: null, hours: 2, seq: 0, timer: null};
const QLABEL = {surf: "Surf", sailing: "Sail", running: "Run", yardwork: "Yard"};
function qStart() {
  const d = new Date(); d.setDate(d.getDate() + Q.day);
  if (Q.day === 0 && Q.hour === null) return new Date();       // right now
  d.setHours(Q.hour, 0, 0, 0); return d;
}
function fmtHour(h) { return h === 0 ? "12 AM" : h < 12 ? `${h} AM` : h === 12 ? "12 PM" : `${h - 12} PM`; }
function renderSched() {
  const q = (DATA.quick || []).find(x => x.kind === Q.kind);
  document.getElementById("mTitle").textContent = `${QLABEL[Q.kind] || Q.kind} check`;
  document.getElementById("mSub").textContent = "How it would be at the watched spot";
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    days.push(`<button type="button" class="chip ${Q.day === i ? "on" : ""}" data-day="${i}">${i === 0 ? "Today" : i === 1 ? "Tomorrow" : d.toLocaleDateString([], {weekday: "short"})}</button>`);
  }
  document.getElementById("mDays").innerHTML = days.join("");
  document.getElementById("mHours").innerHTML = [1, 2, 3, 4].map(h =>
    `<button type="button" class="chip ${Q.hours === h ? "on" : ""}" data-h="${h}">${h} hr</button>`).join("");
  const nowH = new Date().getHours();
  document.getElementById("mStart").textContent = Q.day === 0 && Q.hour === null ? "Now" : fmtHour(Q.hour);
  document.getElementById("mMinus").disabled = Q.day === 0 && Q.hour === null || (Q.day > 0 && Q.hour === 0);
  document.getElementById("mPlus").disabled = Q.hour === 23;
}
async function runCheck() {
  renderSched();
  const box = document.getElementById("mCard"), seq = ++Q.seq;
  box.classList.add("loading");
  try {
    const url = `/api/check/${Q.kind}?hours=${Q.hours}&start=${encodeURIComponent(qStart().toISOString())}`;
    const r = await fetch(url, {cache: "no-store"}); const j = await r.json();
    if (seq !== Q.seq) return;
    box.innerHTML = r.ok ? cardHTML(j, {modal: true}) : `<div class="err">${esc(j.error || "Couldn't rate that")}</div>`;
  } catch (e) { if (seq === Q.seq) box.innerHTML = `<div class="err">Can't reach the server</div>`; }
  box.classList.remove("loading");
}
function closeCheck() { document.getElementById("modal").hidden = true; clearTimeout(Q.timer); Q.kind = null; }
function pokeCheck() { clearTimeout(Q.timer); Q.timer = setTimeout(closeCheck, 60000); }
function openCheck(kind) {
  Object.assign(Q, {kind, day: 0, hour: null, hours: 2});
  document.getElementById("mCard").innerHTML = "";
  document.getElementById("modal").hidden = false;
  pokeCheck(); runCheck();
}
(function () {
  const m = document.getElementById("modal");
  m.addEventListener("click", e => { if (e.target === m) closeCheck(); });   // tap outside closes
  m.addEventListener("pointerdown", pokeCheck);
  document.getElementById("mClose").onclick = closeCheck;
  document.getElementById("mDays").onclick = e => {
    const b = e.target.closest("[data-day]"); if (!b) return;
    const day = +b.dataset.day; if (day === Q.day) return;
    Q.day = day; Q.hour = day === 0 ? null : 7;     // another day starts at 7 AM by default
    runCheck();
  };
  document.getElementById("mHours").onclick = e => { const b = e.target.closest("[data-h]"); if (!b) return; Q.hours = +b.dataset.h; runCheck(); };
  document.getElementById("mMinus").onclick = () => {
    const nowH = new Date().getHours();
    if (Q.day === 0) Q.hour = Q.hour === null || Q.hour - 1 <= nowH ? null : Q.hour - 1;
    else Q.hour = Math.max(0, Q.hour - 1);
    runCheck();
  };
  document.getElementById("mPlus").onclick = () => {
    const nowH = new Date().getHours();
    Q.hour = Q.hour === null ? Math.min(23, nowH + 1) : Math.min(23, Q.hour + 1);
    runCheck();
  };
})();

let TL = null;   // geometry of the rendered strip, for scrolling and the day label

const nowX = () => TL ? TL.nowIdx * TL.cw : 0;   // scroll position that puts "now" at the left edge
function tlScrolled() {
  if (!TL) return;
  const sc = document.getElementById("tlScroll"), off = sc.scrollLeft - nowX(), btn = document.getElementById("tlNow");
  btn.classList.toggle("show", Math.abs(off) > TL.cw * 3);
  btn.textContent = off > 0 ? "← Now" : "Now →";
  // Label the selected card's day while it's on screen; otherwise the day at the left edge
  const c = SELECTED && DATA.cards.find(x => x.id === SELECTED);
  const cx = c ? TL.xt(new Date(c.start).getTime()) : -1;
  const i = Math.min(TL.tl.length - 1, Math.max(0, Math.floor(sc.scrollLeft / TL.cw)));
  const dt = c && cx >= sc.scrollLeft && cx < sc.scrollLeft + sc.clientWidth ? new Date(c.start) : new Date(TL.tl[i].t);
  document.getElementById("tlDay").textContent = dt.toLocaleDateString([], {weekday: "long", month: "short", day: "numeric"});
}

function jumpTimeline() {
  // Put the selected card's window near the left edge (a few hours of lead-in); no selection = now
  const sc = document.getElementById("tlScroll");
  const c = DATA && DATA.cards.find(x => x.id === SELECTED);
  if (!c || !TL) { sc.scrollTo({left: nowX(), behavior: "smooth"}); return; }
  const xa = TL.xt(new Date(c.start).getTime());
  sc.scrollTo({left: Math.max(0, xa - TL.cw * 3), behavior: "smooth"});
}

function renderTimeline(d) {
  const sc = document.getElementById("tlScroll"), svg = document.getElementById("tl"), axis = document.getElementById("tlAxis");
  // Show the selected card's place; otherwise home
  const sel = d.cards.find(c => c.id === SELECTED);
  const key = sel && d.timelines && d.timelines[sel.loc_key] ? sel.loc_key : d.home_key;
  const tl = (d.timelines && d.timelines[key]) || d.timeline; if (!tl || !tl.length) return;
  const placeEl = document.getElementById("tlPlace");
  placeEl.textContent = key === d.home_key ? d.place : sel.location;
  placeEl.classList.toggle("away", key !== d.home_key);

  const nowIdx = key === d.home_key ? (d.timeline_now_index || 0) : 0;
  const wasAtNow = !TL || Math.abs(sc.scrollLeft - nowX()) < (TL ? TL.cw : 1);
  const VW = sc.clientWidth, H = sc.clientHeight, padR = 12;
  const n = tl.length, cw = VW / (d.timeline_visible_hours || 36), W = n * cw + padR;
  const x = i => i * cw + cw / 2;
  const tTop = 48, tBot = 134, rTop = 142, rBot = 176, wY = 198, hY = 220;
  const temps = tl.flatMap(h => [h.temp, h.feels, h.obs_temp, h.obs_feels]).filter(v => v != null);
  const lo = Math.floor(Math.min(...temps) / 5) * 5 - 2, hi = Math.ceil(Math.max(...temps) / 5) * 5 + 2;
  const y = v => tBot - (v - lo) / (hi - lo) * (tBot - tTop);
  const t0 = new Date(tl[0].t).getTime();
  const xt = ms => (ms - t0) / 3600000 * cw;
  TL = {cw, xt, tl, nowIdx};
  let s = "";
  // Past day: shaded, with a "Now" marker and a key to the extra lines
  if (nowIdx > 0) {
    const nx = nowIdx * cw;
    s += `<rect x="0" y="${tTop - 22}" width="${nx}" height="${hY - tTop + 14}" fill="rgba(120,140,170,.07)"/>`;
    s += `<line x1="${nx}" y1="${tTop - 22}" x2="${nx}" y2="${hY - 8}" stroke="var(--ink2)" stroke-width="2" stroke-dasharray="4 4"/>`;
    s += `<text x="${nx + 6}" y="${tTop - 6}" fill="var(--ink)" font-size="13" font-weight="600">Now</text>`;
    s += `<text x="${nx - 8}" y="${tTop - 6}" text-anchor="end" fill="var(--ink2)" font-size="13">`
       + `<tspan fill="#fff" font-weight="600">━ actual</tspan>${d.history_station ? ` (${esc(d.history_station)})` : ""}`
       + `  <tspan fill="var(--temp)">┅ forecast from a day earlier</tspan>  `
       + `<tspan fill="var(--rain)">▮ rain measured ▯ rain forecast</tspan></text>`;
  }

  // Activity windows as shaded bands (selected one highlighted)
  for (const c of d.cards) {
    const a = xt(new Date(c.start).getTime()), b = xt(new Date(c.end).getTime());
    if (b < 0 || a > W) continue;
    const xa = Math.max(0, a), xb = Math.min(W, b), isSel = c.id === SELECTED;
    s += `<rect x="${xa}" y="${tTop - 22}" width="${xb - xa}" height="${hY - tTop + 14}" rx="6"
            fill="${isSel ? "rgba(255,255,255,.10)" : "rgba(255,255,255,.035)"}" ${isSel ? 'stroke="rgba(255,255,255,.5)"' : ""}/>`;
    if (isSel || (!SELECTED && (xb - xa) > c.title.length * 7.5 + 10))
      s += `<text x="${xa + 6}" y="${tTop - 6}" fill="${isSel ? "var(--ink)" : "var(--ink3)"}" font-size="13" font-weight="${isSel ? 600 : 400}">${esc(c.title)}</text>`;
  }
  // Night shading + day separators
  tl.forEach((h, i) => {
    const dt = new Date(h.t);
    if (!h.day) s += `<rect x="${i * cw}" y="${tTop}" width="${cw + .5}" height="${rBot - tTop}" fill="rgba(0,0,0,.25)"/>`;
    if (dt.getHours() === 0 && i > 0) {
      s += `<line x1="${i * cw}" y1="${tTop - 18}" x2="${i * cw}" y2="${hY + 4}" stroke="var(--line)" stroke-width="2"/>`;
      s += `<text x="${i * cw + 6}" y="${hY + 4}" fill="var(--ink2)" font-size="13" font-weight="600">${dt.toLocaleDateString([], {weekday:"short"})}</text>`;
    }
  });
  // Temperature gridlines (labels live on the fixed axis)
  let ax = "";
  for (let v = Math.ceil(lo / 10) * 10; v <= hi; v += 10) {
    s += `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 5"/>`;
    ax += `<text x="38" y="${y(v) + 4}" text-anchor="end" fill="var(--ink3)" font-size="13">${v}°</text>`;
  }
  ax += `<text x="0" y="${rBot - 4}" fill="var(--rain)" font-size="12">rain</text><text x="0" y="${wY + 5}" fill="var(--wind)" font-size="12">mph</text>`;
  // Tide (forecast side only): soft teal curve in the rain band, behind the bars, H/L labels
  const tide = d.tides && d.tides[key];
  const tideLeg = document.getElementById("tideLeg"); if (tideLeg) tideLeg.hidden = !tide;
  if (tide && tide.hourly.length > 1) {
    const pts = tide.hourly.map(([t, ft]) => [xt(new Date(t).getTime()) + cw / 2, ft]).filter(p => p[0] >= nowIdx * cw);
    const fts = pts.map(p => p[1]), tlo = Math.min(...fts), thi = Math.max(...fts);
    const ty = ft => rBot - 3 - (ft - tlo) / Math.max(0.1, thi - tlo) * (rBot - rTop - 10);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${ty(p[1]).toFixed(1)}`).join("");
    if (pts.length > 1) {
      s += `<path d="${line}L${pts[pts.length - 1][0].toFixed(1)},${rBot}L${pts[0][0].toFixed(1)},${rBot}Z" fill="rgba(56,178,172,.13)"/>`;
      s += `<path d="${line}" fill="none" stroke="var(--s4)" stroke-width="1.6" opacity=".8"/>`;
      for (const ev of tide.events) {
        const ex = xt(new Date(ev.t).getTime()); if (ex < nowIdx * cw || ex > W) continue;
        const lbl = `${ev.type} ${hourLbl(new Date(ev.t)).replace(/([ap])$/, "")}${new Date(ev.t).toLocaleTimeString([], {minute: "2-digit"}) !== "00" ? ":" + new Date(ev.t).toLocaleTimeString([], {minute: "2-digit"}).padStart(2, "0") : ""}${hourLbl(new Date(ev.t)).slice(-1)}`;
        const ey = ev.type === "H" ? ty(thi) - 3 : ty(tlo) - 5;
        s += `<text x="${ex}" y="${ey}" text-anchor="middle" fill="var(--s4)" font-size="11" font-weight="600">${lbl}</text>`;
      }
    }
  }
  // Past: rain amounts, measured (filled) vs forecast a day earlier (outline); full height = 0.25 in
  const amtH = a => Math.min(1, (a || 0) / 0.25) * (rBot - rTop);
  tl.forEach((h, i) => {
    if (!h.past) return;
    const fh = amtH(h.precip), oh = amtH(h.obs_precip);
    if (fh > 0.5) s += `<rect x="${i * cw + 3}" y="${rBot - fh}" width="${cw - 6}" height="${fh}" rx="2" fill="none" stroke="var(--rain)" stroke-width="1.5" opacity=".9"/>`;
    if (oh > 0.5) s += `<rect x="${i * cw + 6}" y="${rBot - oh}" width="${cw - 12}" height="${oh}" rx="2" fill="var(--rain)"/>`;
    const lab = Math.max(h.obs_precip || 0, h.precip || 0);
    if (lab >= 0.02) s += `<text x="${x(i)}" y="${rBot - Math.max(fh, oh) - 4}" text-anchor="middle" fill="var(--rain)" font-size="11">${(h.obs_precip || 0).toFixed(2)}″</text>`;
  });
  // Future: rain probability bars
  tl.forEach((h, i) => {
    if (h.past) return;
    const p = (h.pop || 0) / 100, bh = p * (rBot - rTop);
    if (p > .02) s += `<rect x="${i * cw + 3}" y="${rBot - bh}" width="${cw - 6}" height="${bh}" rx="2" fill="var(--rain)" opacity="${.35 + .6 * p}"/>`;
    if ((h.pop || 0) >= 30 && i % 2 === 0) s += `<text x="${x(i)}" y="${rBot - bh - 4}" text-anchor="middle" fill="var(--rain)" font-size="12">${r0(h.pop)}%</text>`;
  });
  s += `<line x1="0" x2="${W}" y1="${rBot}" y2="${rBot}" stroke="var(--line)"/>`;
  // Lines. Future: forecast temp (solid orange) + feels-like (gray dashed).
  // Past: forecast from a day earlier (thin dashed orange / gray) + actual (white).
  const path = (k, from, to) => {
    let d2 = "", pen = false;
    for (let i = from; i < to; i++) {
      const v = tl[i][k];
      if (v == null) { pen = false; continue; }
      d2 += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true;
    }
    return d2;
  };
  const N = tl.length;
  if (nowIdx > 0) {
    s += `<path d="${path("feels", 0, nowIdx)}" fill="none" stroke="var(--ink3)" stroke-width="1.5" stroke-dasharray="2 4" opacity=".8"/>`;
    s += `<path d="${path("temp", 0, nowIdx)}" fill="none" stroke="var(--temp)" stroke-width="2.5" stroke-dasharray="7 5" opacity=".85"/>`;
    s += `<path d="${path("obs_feels", 0, nowIdx)}" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="5 4" opacity=".6"/>`;
    s += `<path d="${path("obs_temp", 0, nowIdx)}" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"/>`;
  }
  s += `<path d="${path("feels", nowIdx, N)}" fill="none" stroke="var(--ink3)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s += `<path d="${path("temp", nowIdx, N)}" fill="none" stroke="var(--temp)" stroke-width="3.5" stroke-linejoin="round"/>`;
  tl.forEach((h, i) => {
    if ((i - nowIdx) % 3 !== 0) return;
    if (h.past) {           // actual (white) above, forecast (orange) below
      if (h.obs_temp != null) s += `<text x="${x(i)}" y="${y(Math.max(h.obs_temp, h.temp ?? -99)) - 9}" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">${r0(h.obs_temp)}°</text>`;
      if (h.temp != null) s += `<text x="${x(i)}" y="${y(Math.min(h.temp, h.obs_temp ?? 999)) + 18}" text-anchor="middle" fill="var(--temp)" font-size="12">${r0(h.temp)}°</text>`;
    } else if (h.temp != null)
      s += `<text x="${x(i)}" y="${y(h.temp) - 9}" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="500">${r0(h.temp)}°</text>`;
  });
  // Wind arrows (point the way the wind blows) + speed, every other hour
  tl.forEach((h, i) => {
    if (i % 2 || h.dir == null) return;
    const strong = (h.wind || 0) >= 15, col = strong ? "var(--s1)" : "var(--wind)";
    s += `<g transform="translate(${x(i) - 13},${wY}) rotate(${h.dir + 180})"><path d="M0,-8 L5,5 L0,2 L-5,5 Z" fill="${col}"/></g>
          <text x="${x(i) + 1}" y="${wY + 5}" fill="${col}" font-size="13">${r0(h.wind)}${h.gust - h.wind >= 8 ? "<tspan fill='var(--ink3)' font-size='11'>g" + r0(h.gust) + "</tspan>" : ""}</text>`;
  });
  // Hour labels
  tl.forEach((h, i) => { const dt = new Date(h.t);
    if (i % 2 === 0 && dt.getHours() !== 0) s += `<text x="${x(i)}" y="${hY + 4}" text-anchor="middle" fill="var(--ink3)" font-size="13">${hourLbl(dt)}</text>`; });

  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = s;
  axis.setAttribute("viewBox", `0 0 44 ${H}`); axis.setAttribute("height", H);
  axis.innerHTML = ax;
  if (wasAtNow && !SELECTED) sc.scrollLeft = nowX();   // first draw, or keep "now" pinned as hours roll over
  tlScrolled();
}

function render(d) {
  DATA = d; renderNow(d); renderCards(d); renderTimeline(d); dimCheck(d);
  document.getElementById("pwrBtn").onclick = e => { e.stopPropagation(); screenOff(); };
}

// ---------- screen power ----------
// Overnight the server turns the screen off on a schedule (a tap can't wake the
// Corsair from standby). During the day the page dims the backlight over HDMI after
// a few idle minutes; the monitor stays awake, so the first tap restores it (and is
// swallowed so it doesn't also select a card).
let DIMMED = false, LAST_INPUT = Date.now(), SWALLOW_UNTIL = 0;
async function brightness(level) {
  try {
    const r = await fetch("/api/display/brightness", {method: "POST", headers: {"Content-Type": "application/json"},
                                                      body: JSON.stringify({level})});
    return r.ok;
  } catch (e) { console.error(e); return false; }
}
document.addEventListener("pointerdown", e => {
  LAST_INPUT = Date.now();
  if (DIMMED || Date.now() < SWALLOW_UNTIL) {
    e.stopPropagation(); e.preventDefault();
    if (DIMMED) { DIMMED = false; SWALLOW_UNTIL = Date.now() + 800; brightness("bright"); }
  }
}, true);
document.addEventListener("click", e => { if (Date.now() < SWALLOW_UNTIL) { e.stopPropagation(); e.preventDefault(); } }, true);
setInterval(async () => {
  const cfg = DATA && DATA.display; if (!cfg || !cfg.power || !cfg.power.dim_available) return;
  if (Q.kind) return;   // quick-check pop-up is open
  if (!DIMMED && cfg.dim_after > 0 && Date.now() - LAST_INPUT > cfg.dim_after * 60000) {
    if (await brightness("dim")) DIMMED = true;
  }
}, 10000);
function syncDim(serverDimmed) {   // brightness changed elsewhere (planner, schedule)
  if (DIMMED && !serverDimmed) LAST_INPUT = Date.now();
  DIMMED = serverDimmed;
}
async function screenOff() {
  try {
    await fetch("/api/display/power", {method: "POST", headers: {"Content-Type": "application/json"},
                                       body: JSON.stringify({on: false})});
  } catch (e) { console.error(e); }
}

function dimCheck(d) {
  // Dim the panel between sunset+1h and sunrise-30m (set ?nodim to disable)
  if (location.search.includes("nodim") || !d.now.sunset) return;
  const now = new Date(), [sh, sm] = d.now.sunset.split(":").map(Number), [rh, rm] = d.now.sunrise.split(":").map(Number);
  const mins = now.getHours() * 60 + now.getMinutes();
  const set = (sh + 12) * 60 + sm + 60, rise = rh * 60 + rm - 30;
  document.body.classList.toggle("dim", mins > set || mins < rise);
}

async function load() {
  try {
    const r = await fetch("/api/dashboard", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    console.error(e);
    const o = document.getElementById("offline");
    if (o) o.textContent = `⚠ Can't reach the forecast server (${new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})})`;
  }
}
setInterval(() => { const c = document.getElementById("clock");
  if (c) c.textContent = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }, 15000);
setInterval(load, REFRESH_MS);
load();

// When an update is deployed the server restarts with a new version;
// reload the page so the kiosk picks up new layout/code without a reboot.
let BOOT_VERSION = null, PLANS_REV = null;
setInterval(async () => {
  try {
    const j = await (await fetch("/api/version", {cache: "no-store"})).json();
    if (BOOT_VERSION === null) { BOOT_VERSION = j.version; PLANS_REV = j.plans_rev; }
    else if (j.version !== BOOT_VERSION) location.reload();
    else if (j.plans_rev !== PLANS_REV) { PLANS_REV = j.plans_rev; load(); }  // a plan was saved
    if (j.dimmed !== undefined) syncDim(j.dimmed);
  } catch (e) { /* server restarting — try again next tick */ }
}, 20000);
</script>
