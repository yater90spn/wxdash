# wxdash configuration ─────────────────────────────────────────────────────
timezone: America/New_York
home: home                 # location used for the "now" panel and hourly strip
refresh_minutes: 30        # HRRR updates hourly; 30 min keeps well under Open-Meteo's free limits
forecast_days: 7
lookahead_days: 7          # days of scheduled activities to show (weekend items stay visible all week)
timeline_hours: 36         # hours visible at once on the bottom strip (swipe for the rest of the week)
history_hours: 24          # past hours on the strip: actual (NWS station) vs forecast from a day earlier
# obs_station: KBLM        # NWS station for actuals; default = nearest reporting station
tide_station: "8531680"    # NOAA tide station for the strip's tide curve (Sandy Hook); remove to hide

# Open-Meteo model ids, in blend priority order (first non-null wins per hour;
# HRRR runs out after ~18–48 h and NBM/GFS take over automatically).
models: [ncep_hrrr_conus, ncep_nbm_conus, ncep_gfs_seamless]
# var_priority:            # optional per-variable override
#   precipitation_probability: [ncep_nbm_conus, ncep_gfs_seamless]

# ── Places ────────────────────────────────────────────────────────────────
# Starting points — adjust coordinates and beach orientation to your spots.
locations:
  home:
    name: Atlantic Highlands
    lat: 40.413
    lon: -74.035

  sandy_hook_lot_b:
    name: Sandy Hook – Lot B
    lat: 40.4175             # South Beach, north end of Lot B (the second ocean-side lot)
    lon: -73.979
    marine_lat: 40.42        # wave-model point just offshore
    marine_lon: -73.96
    facing: 90               # ocean side faces E → offshore wind is from the W/SW
    swell_window: [20, 160]  # NE through SE reaches the beach; S is blocked by the coast
    noaa_station: "8531680"  # Sandy Hook tide predictions + water temp
    wave_ft: {min: 1.5, ideal: [3, 6], max: 9}

  long_branch:               # secondary spot (example; remove if unused)
    name: Long Branch
    lat: 40.300
    lon: -73.983
    facing: 100              # beach looks out toward ESE → offshore wind is from WNW
    swell_window: [30, 180]  # NE around to S
    noaa_station: "8531680"  # Sandy Hook tide predictions + water temp
    tide: {phase: [mid, high], trend: [rising]}
    wave_ft: {min: 1.5, ideal: [3, 6], max: 9}

  sandy_hook_bay:
    name: Sandy Hook Bay
    lat: 40.425
    lon: -74.030
    marine_lat: 40.47        # wave model grid point out in the Lower Bay
    marine_lon: -74.04
    noaa_station: "8531680"
    wind_kt: {ideal: [8, 15], reef: 18, max: 23}

# ── Global rule overrides per activity (any default can be overridden) ─────
rules:
  spectator:
    uv_sunscreen: 4
  running:
    dress_offset: 15
  # spectator:
  #   wind: [[0,0],[7,0],[12,0.4],[18,1.2],[25,3],[35,5]]

# ── Schedule ──────────────────────────────────────────────────────────────
# Plans and "watch for good conditions" settings are managed on the planner page
# (http://weatherdash.local:8080/plan) and saved in data/plans.json on the Pi.
# Entries here still work and show alongside them, but you don't need any.
max_suggestions: 3         # suggestion cards per watched activity
schedule: []
